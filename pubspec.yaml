name: grill_pos
description: "BBQ Restaurant POS & Order Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Firebase (Auth + Firestore only — no Firebase Storage)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Image picking & upload (Cloudinary — Firebase Storage alternative)
  image_picker: ^1.1.2
  http: ^1.2.2

  # PDF generation (End Day reports)
  pdf: ^3.11.1
  printing: ^5.13.2

  # Bluetooth thermal printing
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # Charts (dashboard revenue chart)
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    - assets/logo.png
